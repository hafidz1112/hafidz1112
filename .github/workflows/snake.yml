name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Memodifikasi warna ular menjadi ungu (light mode) dan pink neon (dark mode)
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#bd93f9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff79c6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}name: Generate Snake Animation

